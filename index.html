<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vokabeltrainer</title>
<meta name="description" content="Englisch-Vokabeln lernen – im Auto per Sprachausgabe, zuhause im Quiz." />
<meta name="theme-color" content="#faf9ff" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="./icons/favicon-64.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Vokabeln" />
<link rel="stylesheet" href="./css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.21.0/lib/msal-browser.min.js" defer></script>
</head>
<body>
<header class="app-header">
  <h1>Marko's Vokabeltrainer</h1>
</header>

<main id="view" class="app-view" aria-live="polite"></main>

<nav class="app-nav">
  <button class="nav-btn" data-mode="audio">
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16l1.2-5.2A2.5 2.5 0 0 1 7.6 9h8.8a2.5 2.5 0 0 1 2.4 1.8L20 16"/>
        <path d="M3.5 16h17v2.5a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-1V17.5H6.7v1a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V16z"/>
        <circle cx="7.5" cy="18" r="1.4"/>
        <circle cx="16.5" cy="18" r="1.4"/>
        <path d="M6 12.5h12"/>
      </svg>
    </span>
    Auto
  </button>
  <button class="nav-btn" data-mode="quiz">
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.3 9.6a2.7 2.7 0 1 1 3.9 2.4c-1 .5-1.5 1-1.5 2.1"/>
        <circle cx="11.7" cy="17" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    Quiz
  </button>
  <button class="nav-btn" data-mode="manage">
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4.5" width="14" height="16.5" rx="2.2"/>
        <path d="M9 3.5h6a1 1 0 0 1 1 1V6.5H8V4.5a1 1 0 0 1 1-1z"/>
        <path d="M8.5 11h7M8.5 14.3h7M8.5 17.6h4.3"/>
      </svg>
    </span>
    Verwalten
  </button>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
